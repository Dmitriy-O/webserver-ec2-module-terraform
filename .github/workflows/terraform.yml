name: Week 12 Terraform
run-name: "${{ github.event_name }} | ${{ inputs.runner || 'github-hosted' }} | ${{ inputs.environment || 'test' }} | ${{ inputs.action || 'plan' }}"

on:
  push:
    branches:
      - main
      - "week12-*"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      runner:
        description: Job executor
        required: true
        default: github-hosted
        type: choice
        options:
          - github-hosted
          - self-hosted
          - autoscaling
      environment:
        description: Target environment
        required: true
        default: test
        type: choice
        options:
          - test
          - production
      action:
        description: Terraform action
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply
          - destroy
          - benchmark
      parallel_jobs:
        description: Number of ephemeral CI workers
        required: true
        default: "1"
        type: choice
        options:
          - "1"
          - "2"

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  GOMAXPROCS: "2"
  GOFLAGS: "-p=1"

jobs:
  checks:
    name: Terraform checks
    if: inputs.runner != 'autoscaling'
    runs-on: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.runner == 'self-hosted' && '["self-hosted","linux","x64","week12"]' || '["ubuntu-24.04"]') }}
    timeout-minutes: 15

    defaults:
      run:
        shell: bash
        working-directory: infrastructure

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show runner identity
        run: |
          printf 'Runner: %s\n' "$RUNNER_NAME"
          uname -m
          nproc
          free -h

      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.2"
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -diff -recursive

      - name: Initialize for validation
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: Validate configuration
        run: terraform validate -no-color

      - name: Install TFLint
        uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.66.0

      - name: Initialize TFLint plugins
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: tflint --init

      - name: Run TFLint
        run: tflint --format compact

      - name: Scan Terraform with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          scan-type: config
          scan-ref: infrastructure
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"

  terraform:
    name: Terraform plan or manual operation
    needs: checks
    if: github.repository == 'Dmitriy-O/webserver-ec2-module-terraform' && github.event_name != 'pull_request' && inputs.runner != 'autoscaling'
    runs-on: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.runner == 'self-hosted' && '["self-hosted","linux","x64","week12"]' || '["ubuntu-24.04"]') }}
    timeout-minutes: 45

    environment: ${{ inputs.environment || 'test' }}

    concurrency:
      group: week12-webserver-${{ inputs.environment || 'test' }}
      cancel-in-progress: false

    env:
      DEPLOY_ENV: ${{ inputs.environment || 'test' }}
      OPERATION: ${{ inputs.action || 'plan' }}
      TF_DATA_DIR: ${{ github.workspace }}/infrastructure/.terraform/${{ inputs.environment || 'test' }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    defaults:
      run:
        shell: bash
        working-directory: infrastructure

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show runner identity
        run: |
          printf 'Runner: %s\n' "$RUNNER_NAME"
          uname -m
          nproc
          free -h

      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.2"
          terraform_wrapper: false

      - name: Initialize S3 backend
        run: terraform init -reconfigure -input=false -lockfile=readonly -backend-config="environments/${DEPLOY_ENV}.s3.tfbackend"

      - name: Terraform plan
        if: inputs.action != 'destroy'
        run: |
          extra_args=()
          if [[ "$OPERATION" == "benchmark" ]]; then
            extra_args+=(-detailed-exitcode)
          fi
          terraform plan -var-file="environments/${DEPLOY_ENV}.tfvars" -input=false -lock-timeout=5m -no-color -out=plan.tfplan "${extra_args[@]}"

      - name: Terraform apply
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'apply'
        run: terraform apply -input=false -lock-timeout=5m -no-color plan.tfplan

      - name: Install Go for Terratest
        if: github.event_name == 'workflow_dispatch' && (inputs.action == 'apply' || inputs.action == 'benchmark')
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27.4"
          cache-dependency-path: test/go.sum

      - name: Run Terratest
        if: github.event_name == 'workflow_dispatch' && (inputs.action == 'apply' || inputs.action == 'benchmark')
        working-directory: test
        run: go test -v -count=1 -timeout 10m ./...

      - name: Terraform destroy
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'destroy'
        run: terraform destroy -var-file="environments/${DEPLOY_ENV}.tfvars" -auto-approve -input=false -lock-timeout=5m -no-color

  autoscaling:
    name: Autoscaling runner pool
    if: github.repository == 'Dmitriy-O/webserver-ec2-module-terraform' && github.event_name == 'workflow_dispatch' && inputs.runner == 'autoscaling'
    uses: ./.github/workflows/autoscaling-pool.yml
    with:
      environment: ${{ inputs.environment }}
      operation: ${{ inputs.action }}
      count: ${{ fromJSON(inputs.parallel_jobs || '1') }}
    secrets: inherit
