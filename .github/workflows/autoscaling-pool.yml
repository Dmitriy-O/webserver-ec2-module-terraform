name: Ephemeral EC2 runner pool

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      operation:
        required: true
        type: string
      count:
        required: true
        type: number
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      RUNNER_ADMIN_TOKEN:
        required: true

permissions:
  contents: read

concurrency:
  group: week12-autoscaling-runner-pool
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  AWS_DEFAULT_REGION: us-east-1
  GOMAXPROCS: "2"
  GOFLAGS: "-p=1"

jobs:
  prepare:
    name: Prepare ephemeral workers
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: ${{ inputs.environment }}
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      RUNNER_ADMIN_TOKEN: ${{ secrets.RUNNER_ADMIN_TOKEN }}
      DEPLOY_ENV: ${{ inputs.environment }}
      OPERATION: ${{ inputs.operation }}
      WORKER_COUNT: ${{ inputs.count }}
      TF_DATA_DIR: ${{ github.workspace }}/infrastructure/.terraform/${{ inputs.environment }}
    outputs:
      label: ${{ steps.pool.outputs.label }}
      matrix: ${{ steps.pool.outputs.matrix }}
      startup_seconds: ${{ steps.pool.outputs.startup_seconds }}
    steps:
      - name: Validate request and secrets
        run: |
          [[ "$DEPLOY_ENV" == test || "$DEPLOY_ENV" == production ]]
          [[ "$OPERATION" == benchmark ]] || { echo 'Select action=benchmark for autoscaling'; exit 1; }
          [[ "$WORKER_COUNT" == 1 || "$WORKER_COUNT" == 2 ]]
          : "${AWS_ACCESS_KEY_ID:?AWS_ACCESS_KEY_ID secret missing}"
          : "${AWS_SECRET_ACCESS_KEY:?AWS_SECRET_ACCESS_KEY secret missing}"
          : "${RUNNER_ADMIN_TOKEN:?RUNNER_ADMIN_TOKEN secret missing}"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: "1.16.2"
          terraform_wrapper: false

      - name: Verify unchanged target before launching EC2
        working-directory: infrastructure
        run: |
          terraform init -reconfigure -input=false -lockfile=readonly -backend-config="environments/${DEPLOY_ENV}.s3.tfbackend"
          terraform plan -var-file="environments/${DEPLOY_ENV}.tfvars" -input=false -lock-timeout=5m -no-color -detailed-exitcode

      - name: Start pool and wait for online workers
        id: pool
        run: python3 scripts/autoscaling_pool.py start --run-key "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --count "$WORKER_COUNT"

      - name: Show recent ASG activity on failure
        if: failure()
        run: aws autoscaling describe-scaling-activities --auto-scaling-group-name week12-autoscaling-runner --max-items 5 --output json

      - name: Record startup measurement
        env:
          STARTUP_SECONDS: ${{ steps.pool.outputs.startup_seconds }}
        run: |
          printf '### Pool startup\n\nWorkers: %s\n\nCold startup to online: %s seconds\n' "$WORKER_COUNT" "$STARTUP_SECONDS" >> "$GITHUB_STEP_SUMMARY"

  ci:
    name: CI worker ${{ matrix.worker }}
    needs: prepare
    runs-on:
      - self-hosted
      - linux
      - x64
      - ${{ needs.prepare.outputs.label }}
    timeout-minutes: 25
    environment: ${{ inputs.environment }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        worker: ${{ fromJSON(needs.prepare.outputs.matrix || '[1]') }}
    env:
      DEPLOY_ENV: ${{ inputs.environment }}
      TF_DATA_DIR: ${{ github.workspace }}/infrastructure/.terraform/${{ inputs.environment }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    defaults:
      run:
        shell: bash
        working-directory: infrastructure
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show runner identity
        run: |
          printf 'Runner: %s\n' "$RUNNER_NAME"
          uname -m
          nproc
          free -h

      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.2"
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -diff -recursive

      - name: Initialize for validation
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: Validate configuration
        run: terraform validate -no-color

      - name: Install TFLint
        uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.66.0

      - name: Initialize TFLint plugins
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: tflint --init

      - name: Run TFLint
        run: tflint --format compact

      - name: Scan Terraform with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          scan-type: config
          scan-ref: infrastructure
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Initialize environment backend
        run: terraform init -reconfigure -input=false -lockfile=readonly -backend-config="environments/${DEPLOY_ENV}.s3.tfbackend"

      - name: Verify unchanged infrastructure
        run: terraform plan -var-file="environments/${DEPLOY_ENV}.tfvars" -input=false -lock-timeout=5m -no-color -detailed-exitcode
      - name: Install Go for Terratest
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27.4"
          cache-dependency-path: test/go.sum

      - name: Run Terratest
        working-directory: test
        run: go test -v -count=1 -timeout 10m ./...

      - name: Record worker identity
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          printf '### Ephemeral CI worker\n\nRunner: %s\n\nEnvironment: %s\n' "$RUNNER_NAME" "$DEPLOY_ENV" >> "$GITHUB_STEP_SUMMARY"

  cleanup:
    name: Scale pool to zero
    needs: [prepare, ci]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: ${{ inputs.environment }}
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      RUNNER_ADMIN_TOKEN: ${{ secrets.RUNNER_ADMIN_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Terminate workers and remove temporary template
        run: python3 scripts/autoscaling_pool.py stop --run-key "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

      - name: Confirm empty ASG
        run: |
          aws autoscaling describe-auto-scaling-groups --auto-scaling-group-names week12-autoscaling-runner --output json > "$RUNNER_TEMP/asg.json"
          python3 -c 'import json,os; s=json.load(open(os.path.join(os.environ["RUNNER_TEMP"],"asg.json")))["AutoScalingGroups"][0]; assert s["DesiredCapacity"] == 0 and not s["Instances"], "Pool is not empty"; print("Verified: Desired=0, Instances=0")'
          printf '### Cleanup\n\nVerified ASG: Desired=0, Instances=0\n' >> "$GITHUB_STEP_SUMMARY"
