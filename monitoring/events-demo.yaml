apiVersion: v1
kind: Pod
metadata:
  name: events-demo
  namespace: demo
  labels:
    app: events-demo
spec:
  automountServiceAccountToken: false

  nodeSelector:
    week13-event-test: nonexistent-node

  containers:
    - name: sleeper
      image: busybox:1.37
      command:
        - sh
        - -c
        - sleep 3600
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 32Mi
