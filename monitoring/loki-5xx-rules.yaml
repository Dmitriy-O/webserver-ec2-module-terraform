apiVersion: v1
kind: ConfigMap
metadata:
  name: week13-loki-alert-rules
  namespace: monitoring
data:
  rules.yaml: |
    groups:
      - name: week13.http-errors
        interval: 15s
        rules:
          - alert: Week13HTTP5xxSpike
            expr: |
              sum by (namespace, app) (
                count_over_time(
                  {namespace="demo", app="http-demo"}
                  | json
                  | status >= 500
                  | status < 600
                  | __error__=""
                  [2m]
                )
              ) >= 10
            for: 30s
            labels:
              severity: warning
              project: week13
            annotations:
              summary: HTTP 5xx spike detected in application logs
              description: >-
                Application {{ $labels.app }} in namespace
                {{ $labels.namespace }} produced at least 10 HTTP 5xx
                responses in the last 2 minutes.
                The condition persisted for 30 seconds.
