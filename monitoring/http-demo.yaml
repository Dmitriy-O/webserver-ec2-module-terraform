apiVersion: v1
kind: ConfigMap
metadata:
  name: http-demo
  namespace: demo
data:
  server.py: |
    import json
    from datetime import datetime, timezone
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            path = self.path.split("?", 1)[0]
            status = 500 if path == "/fail" else 200
            body = json.dumps({"status": status, "path": path}).encode()

            self.send_response(status)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

            if path != "/healthz":
                print(json.dumps({
                    "timestamp": datetime.now(timezone.utc).isoformat(),
                    "level": "error" if status >= 500 else "info",
                    "service": "http-demo",
                    "method": "GET",
                    "path": path,
                    "status": status
                }), flush=True)

        def log_message(self, format, *args):
            pass

    ThreadingHTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: http-demo
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: http-demo
  template:
    metadata:
      labels:
        app: http-demo
    spec:
      automountServiceAccountToken: false
      containers:
        - name: http-demo
          image: python:3.12-alpine
          command: ["python", "-u", "/app/server.py"]
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
          volumeMounts:
            - name: code
              mountPath: /app
              readOnly: true
      volumes:
        - name: code
          configMap:
            name: http-demo
---
apiVersion: v1
kind: Service
metadata:
  name: http-demo
  namespace: demo
spec:
  selector:
    app: http-demo
  ports:
    - name: http
      port: 8080
      targetPort: http
