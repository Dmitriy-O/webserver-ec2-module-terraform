alertmanager:
  config:
    global:
      resolve_timeout: 5m
      smtp_smarthost: mailpit.monitoring.svc.cluster.local:1025
      smtp_from: alertmanager@week13.local
      smtp_require_tls: false

    route:
      receiver: "null"
      group_by:
        - alertname
        - namespace
      group_wait: 30s
      group_interval: 1m
      repeat_interval: 4h
      routes:
        - receiver: mailpit
          matchers:
            - 'project="week13"'
          group_wait: 5s
          group_interval: 30s
          repeat_interval: 1h

    receivers:
      - name: "null"
      - name: mailpit
        email_configs:
          - to: student@week13.local
            send_resolved: true
