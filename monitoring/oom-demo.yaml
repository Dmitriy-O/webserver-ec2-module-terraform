apiVersion: v1
kind: Pod
metadata:
  name: oom-demo
  namespace: demo
  labels:
    app: oom-demo
    purpose: monitoring-verification
spec:
  restartPolicy: Always
  automountServiceAccountToken: false
  terminationGracePeriodSeconds: 5

  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault

  containers:
    - name: memory-test
      image: python:3.12-alpine
      command:
        - python
        - -u
        - -c
      args:
        - |
          import time
          from pathlib import Path

          marker = Path("/state/oom-triggered")

          if marker.exists():
              print("Recovery mode: the OOM test has already run.")
              print("The container will remain running for verification.")
              time.sleep(86400)
          else:
              print("Waiting 90 seconds for baseline metrics.")
              time.sleep(90)

              marker.write_text("triggered")
              print("Allocating memory beyond the 64 MiB limit.")

              blocks = []
              while True:
                  blocks.append(bytearray(8 * 1024 * 1024))
                  print(f"Allocated {len(blocks) * 8} MiB")
                  time.sleep(0.2)

      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi

      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL

      volumeMounts:
        - name: state
          mountPath: /state

  volumes:
    - name: state
      emptyDir:
        sizeLimit: 1Mi
